<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petanque Referee Pro</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { margin: 0; font-family: system-ui, sans-serif; background: #121212; color: white; overflow: hidden; }
        #camera-container { position: relative; width: 100vw; height: 70vh; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        
        /* Leveler UI */
        #leveler { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; }
        #bubble { width: 14px; height: 14px; background: red; border-radius: 50%; position: absolute; top: 23px; left: 23px; transition: transform 0.1s; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 20px; height: 2px; background: rgba(0,255,0,0.5); transform: translate(-50%, -50%); }
        #crosshair::after { content: ''; position: absolute; left: 9px; top: -9px; width: 2px; height: 20px; background: rgba(0,255,0,0.5); }
        
        /* Status & Controls */
        #status { text-align: center; padding: 10px; font-weight: bold; background: #222; }
        .controls { display: flex; justify-content: space-around; padding: 10px; background: #222; height: 30vh; flex-direction: column; }
        button { padding: 12px; border: none; border-radius: 8px; background: #007bff; color: white; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 5px; }
        button.danger { background: #dc3545; }
        
        /* History */
        #history-panel { display: none; height: 100vh; width: 100vw; position: absolute; top: 0; left: 0; background: #121212; z-index: 10; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .history-item { display: flex; justify-content: space-between; background: #333; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        .history-item img { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- Main Camera View -->
    <div id="main-view">
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            
            <div id="leveler">
                <div id="crosshair"></div>
                <div id="bubble"></div>
            </div>
        </div>
        
        <div id="status">Tegakkan telefon supaya rata...</div>
        
        <div class="controls">
            <button onclick="resetCamera()" id="btn-reset" style="display:none;">Snap Semula</button>
            <button onclick="showHistory()">Lihat Sejarah</button>
        </div>
    </div>

    <!-- History Panel -->
    <div id="history-panel">
        <h2>Sejarah Keputusan</h2>
        <div id="history-list"></div>
        <button onclick="hideHistory()">Kembali ke Kamera</button>
        <button class="danger" onclick="clearHistory()">Padam Semua Sejarah</button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const bubble = document.getElementById('bubble');
        const statusEl = document.getElementById('status');
        const btnReset = document.getElementById('btn-reset');
        
        let isSnapped = false;
        let steadyTimer = null;

        // Inisialisasi Kamera dengan Auto-Focus (jika disokong)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    }
                });
                video.srcObject = stream;
                
                // Cuba paksa auto-focus
                const track = stream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
                    track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
                }
            } catch (err) {
                statusEl.innerText = "Ralat Kamera: " + err.message;
            }
        }

        // Timbang Air (Gyroscope)
        window.addEventListener('deviceorientation', (e) => {
            if (isSnapped || !e.beta || !e.gamma) return;

            // beta = depan/belakang, gamma = kiri/kanan
            // Hadkan pergerakan bubble untuk UI
            const y = Math.max(-23, Math.min(23, e.beta));
            const x = Math.max(-23, Math.min(23, e.gamma));
            bubble.style.transform = `translate(${x}px, ${y}px)`;

            // Logik Auto Snap (toleransi rata ±2 darjah)
            if (Math.abs(e.beta) < 2 && Math.abs(e.gamma) < 2) {
                bubble.style.background = '#00ff00'; // Hijau tanda sedia
                statusEl.innerText = "Tahan telefon... (Memfokus)";
                
                if (!steadyTimer) {
                    steadyTimer = setTimeout(() => {
                        autoSnap();
                    }, 1500); // 1.5 saat stabil sebelum snap
                }
            } else {
                bubble.style.background = 'red';
                statusEl.innerText = "Tegakkan telefon supaya rata...";
                clearTimeout(steadyTimer);
                steadyTimer = null;
            }
        });

        // Proses Tangkap Gambar & Auto Adjust
        function autoSnap() {
            isSnapped = true;
            video.style.display = 'none';
            canvas.style.display = 'block';
            btnReset.style.display = 'block';
            statusEl.innerText = "Mengira jarak...";

            // Set saiz kanvas sama dengan resolusi video
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;

            // Auto-Adjust: Tingkatkan contrast dan sharpness menggunakan penapis sebelum draw
            ctx.filter = 'contrast(1.2) brightness(1.1)';
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Di sini letaknya integrasi model AI atau OpenCV untuk mengesan bola
            // Mock-up tanda:
            ctx.fillStyle = 'yellow';
            ctx.font = '50px Arial';
            ctx.fillText('1', canvas.width/2 + 50, canvas.height/2 + 50); // Contoh bola 1

            // Simpan ke LocalStorage
            saveToHistory(canvas.toDataURL('image/jpeg', 0.8));
        }

        function resetCamera() {
            isSnapped = false;
            video.style.display = 'block';
            canvas.style.display = 'none';
            btnReset.style.display = 'none';
            statusEl.innerText = "Tegakkan telefon supaya rata...";
        }

        // Pengurusan Sejarah (LocalStorage)
        function saveToHistory(dataUrl) {
            let history = JSON.parse(localStorage.getItem('petanque_history') || '[]');
            const record = {
                id: Date.now(),
                date: new Date().toLocaleString('ms-MY'),
                image: dataUrl
            };
            history.unshift(record); // Masuk paling atas
            localStorage.setItem('petanque_history', JSON.stringify(history));
        }

        function showHistory() {
            document.getElementById('main-view').style.display = 'none';
            document.getElementById('history-panel').style.display = 'block';
            const list = document.getElementById('history-list');
            let history = JSON.parse(localStorage.getItem('petanque_history') || '[]');
            
            if(history.length === 0) {
                list.innerHTML = "<p>Tiada rekod.</p>";
                return;
            }

            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <div>
                        <small>${item.date}</small><br>
                        <strong>Keputusan Tersimpan</strong>
                    </div>
                    <img src="${item.image}" alt="Record">
                </div>
            `).join('');
        }

        function hideHistory() {
            document.getElementById('history-panel').style.display = 'none';
            document.getElementById('main-view').style.display = 'block';
        }

        function clearHistory() {
            if(confirm("Padam semua sejarah pengiraan?")) {
                localStorage.removeItem('petanque_history');
                showHistory();
            }
        }

        // Daftar Service Worker untuk PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    console.log('SW Berdaftar: ', reg.scope);
                });
            });
        }

        // Mula Kamera
        initCamera();
    </script>
</body>
</html>
